<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de pedidos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:768px;margin:0 auto;padding:0 16px}
.main{padding:20px 16px}
.banner{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:12px;text-align:center;padding:8px 16px}
.header{background:linear-gradient(135deg,#1e3a8a 0%,#4338ca 55%,#4f46e5 100%);border-bottom:none}
.header-bp{background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px}
.head-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px}
.brand{display:flex;align-items:center;gap:12px}
.wmark{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;flex:none}
.wmark svg{width:24px;height:24px}
.app-title{font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff}
.app-sub{font-size:12px;color:#c7d2fe}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;font-family:inherit}
.btn .ic{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,#1d4ed8,#4338ca)}
.btn-head{background:#fff;color:#3730a3}
.btn-head:hover{background:#eef2ff}
.btn-main{background:var(--main);color:#fff;width:100%;padding:11px 16px;margin-top:4px}
.btn-sec{background:#fff;color:#334155;border:1px solid #cbd5e1}
.btn-sec:hover{background:#f8fafc}
.btn-danger{background:#e11d48;color:#fff}
.btn-danger:hover{background:#be123c}
.grow{flex:1}
.hide-sm{display:inline}.only-sm{display:none}
@media(max-width:520px){.hide-sm{display:none}.only-sm{display:inline}}
.searchbox{position:relative;margin-bottom:16px}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8;pointer-events:none}
.search-inp{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px 10px 36px;font-size:14px;font-family:inherit;background:#fff;color:#0f172a}
.search-inp:focus{outline:none;border-color:#0f172a;box-shadow:0 0 0 1px #0f172a}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip:hover{border-color:#cbd5e1}
.chip.active{background:var(--soft);color:var(--softtext);border-color:var(--brd)}
.chip-n{margin-left:2px;background:#f1f5f9;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;color:#334155}
.chip.active .chip-n{background:#fff}
.meta{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.linkbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#475569;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.linkbtn .ic{width:14px;height:14px}
.linkbtn:hover{color:#0f172a}
.muted-xs{font-size:12px;color:#94a3b8}
.muted-sm{font-size:12px;color:#64748b}
.bold-xs{font-size:12px;font-weight:700;color:#334155}
.done-sm{font-size:12px;font-weight:600;color:#059669}
.cards{display:flex;flex-direction:column;gap:12px}
.oc{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--brd);border-left:4px solid var(--edge);border-radius:12px;padding:16px;cursor:pointer;font-family:inherit;transition:box-shadow .15s ease,transform .15s ease}
.oc:hover{box-shadow:0 6px 16px rgba(15,23,42,.12);transform:translateY(-1px)}
.oc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.oc-name{font-weight:600;color:#0f172a;word-break:break-word}
.oc-name-wrap{min-width:0}
.oc-name-wrap .mono{margin-top:2px}
.oc-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.rk-pos{width:34px;text-align:center;font-family:ui-monospace,monospace;color:#94a3b8;font-weight:700}
.rk-name{font-weight:700;color:#0f172a}
.dash-tbl tr.rk-top .rk-pos{color:#0d9488}
.rk-badge{display:inline-block;font-family:ui-monospace,monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4;border-radius:5px;padding:1px 5px;vertical-align:middle}
.oc-fin{display:inline-flex;align-items:center;gap:4px;color:#047857;white-space:nowrap}
.oc-fin .ic{width:13px;height:13px}
.badge{display:inline-flex;align-items:center;gap:6px;flex:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--softtext);white-space:nowrap}
.badge .ic{width:14px;height:14px}
.badge-done{background:#ecfdf5;color:#047857}
.progress{display:flex;gap:4px;margin-top:12px}
.seg{height:6px;flex:1;border-radius:999px;background:#e2e8f0}
.seg.fill{background:var(--main)}
.hstepper{display:flex;margin:4px 0 2px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;padding:0 2px}
.step:not(:first-child)::before{content:'';position:absolute;top:15px;left:-50%;width:100%;height:0;border-top:2px solid #e2e8f0;z-index:0}
.step.ln-done:not(:first-child)::before{border-top-color:#10b981}
.step.ln-active:not(:first-child)::before{border-top-style:dashed;border-top-color:#f59e0b}
.step.ln-skip:not(:first-child)::before{border-top-style:dashed;border-top-color:#cbd5e1}
@keyframes stepPulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}70%{box-shadow:0 0 0 8px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.step-circ{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;z-index:1;background:#fff;border:2px solid #e2e8f0;color:#94a3b8;flex:none}
.step-circ .ic{width:16px;height:16px}
.step-circ.done{background:#10b981;border-color:#10b981;color:#fff}
.step-circ.active{background:#f59e0b;border-color:#f59e0b;color:#fff;animation:stepPulse 1.6s ease-out infinite}
.step-circ.skip{background:#fff;border-style:dashed;border-color:#cbd5e1;color:#cbd5e1}
.step-lbl{margin-top:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#94a3b8;line-height:1.3}
.step-lbl.done{color:#059669}
.step-lbl.active{color:#b45309}
.step-lbl.skip{color:#cbd5e1}
.empty-title{font-size:16px;font-weight:600}
.empty-sub{font-size:14px;color:#64748b;margin-top:4px;max-width:360px}
.nores{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:32px;text-align:center;font-size:14px;color:#64748b}
.footnote{margin-top:24px;text-align:center;font-size:12px;color:#94a3b8;font-family:ui-monospace,monospace}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0}
.accentbar{height:4px;background:var(--main)}
.top-inner{max-width:768px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top-titles{min-width:0;flex:1}
.top-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:none;background:none;border-radius:8px;color:#475569;cursor:pointer;flex:none}
.icon-btn .ic{width:20px;height:20px}
.icon-btn:hover{background:#f1f5f9}
.icon-btn.danger{color:#94a3b8}
.icon-btn.danger:hover{background:#fff1f2;color:#e11d48}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px}
.pad{padding:16px}
.row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.row-gap{display:flex;gap:12px;margin-top:16px}
.stepper{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.field{display:block;margin-bottom:12px}
.flabel{display:block;margin-bottom:4px;font-family:ui-monospace,monospace;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
.req{color:#f43f5e}
.inp{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:#0f172a}
.inp:focus{outline:none;border-color:#0f172a;box-shadow:0 0 0 1px #0f172a}
.ta{resize:vertical;min-height:76px}
.money-wrap{position:relative;display:block}
.money-pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:#64748b;pointer-events:none;font-family:ui-monospace,monospace}
.money-inp{padding-left:36px;font-variant-numeric:tabular-nums}
.money-ro{font-variant-numeric:tabular-nums}
.dash-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.dash-ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.dash-lbl{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-right:2px}
.dash-sel{width:auto;min-width:158px;padding:6px 12px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid #e2e8f0;color:#475569;background:#fff;font-family:inherit}
.dash-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(min-width:620px){.dash-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:11px 12px}
.kpi-lbl{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:5px}
.kpi-val{font-size:17px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-sub{margin-top:3px;font-size:11px;color:#94a3b8}
.dash-card{position:relative;border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:12px 8px 4px}
.dash-cardtitle{font-size:13px;font-weight:700;color:#0f172a;padding:0 6px 8px}
.dash-scroll{overflow-x:auto}
.dash-svg{display:block;width:100%;min-width:560px;height:auto;touch-action:pan-y}
.dash-tip{position:absolute;left:0;top:0;pointer-events:none;background:#0f172a;color:#fff;border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.4;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s;z-index:5;box-shadow:0 4px 14px rgba(15,23,42,.25)}
.dash-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
.dash-tbl th{text-align:left;font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;border-bottom:1px solid #e2e8f0;padding:6px 8px}
.dash-tbl td{padding:6px 8px;border-bottom:1px solid #f1f5f9;color:#334155}
.dash-tbl td.num,.dash-tbl th.num{text-align:right}
.dash-tbl td.num{font-variant-numeric:tabular-nums;font-weight:700;color:#0f172a}
.dash-tbl tr.now td{background:#f0fdfa}
.dash-empty{padding:30px 12px;text-align:center;color:#94a3b8;font-size:13px}
.dash-sec{margin-top:18px}
.dash-sectitle{font-family:ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:8px}
.per-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.per-navbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #e2e8f0;background:#fff;border-radius:10px;color:#475569;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1}
.per-navbtn:hover{border-color:#cbd5e1;background:#f8fafc}
.per-date{padding:7px 12px;font-size:13px;font-weight:600;border-radius:10px;border:1px solid #e2e8f0;color:#0f172a;background:#fff;font-family:inherit}
.per-daylbl{font-size:13px;color:#64748b;margin-bottom:14px}
.per-fgrid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 6px 12px}
@media(min-width:700px){.per-fgrid{grid-template-columns:1fr 1.4fr .6fr 1.2fr auto;align-items:end}}
.per-f{display:flex;flex-direction:column;gap:5px}
.per-f .flabel{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}
.per-f .inp{width:100%}
.per-addbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:10px;background:#7c3aed;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.per-addbtn:hover{background:#6d28d9}
.per-msg{margin:0 6px 12px;font-size:12px;border-radius:8px;padding:8px 10px;background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe}
.per-msg.err{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.per-x{border:none;background:none;color:#94a3b8;cursor:pointer;padding:3px;line-height:0;border-radius:6px}
.per-x:hover{color:#dc2626;background:#fef2f2}
.per-who{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#0f172a}
.per-dot{width:8px;height:8px;border-radius:50%;flex:none}
.per-bar{height:6px;border-radius:999px;background:#f1f5f9;overflow:hidden;margin-top:5px}
.per-barfill{height:100%;border-radius:999px}
.kpi.over .kpi-val{color:#b45309}
.per-tag{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 6px}
.per-acts{display:inline-flex;gap:2px;justify-content:flex-end}
.per-x .ic,.per-e .ic{width:15px;height:15px}
.per-addbtn .ic{width:15px;height:15px}
.per-e{border:none;background:none;color:#94a3b8;cursor:pointer;padding:3px;line-height:0;border-radius:6px}
.per-e:hover{color:#7c3aed;background:#f5f3ff}
.per-editrow>td{background:#faf5ff;padding:0;border-left:3px solid #7c3aed}
.per-editbox{padding:12px 4px 2px}
.per-edittitle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6d28d9;padding:0 6px 10px}
.per-edittitle .ic{width:14px;height:14px}
.per-eacts{display:flex;gap:8px;padding:0 6px 12px;flex-wrap:wrap}
.per-cancelbtn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#475569;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.per-cancelbtn:hover{background:#f8fafc}
@media(min-width:700px){.per-egrid{grid-template-columns:1fr 1.4fr .6fr 1.2fr .9fr}}
.cmp{border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:14px;margin-bottom:14px}
.cmp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cmp-t{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#64748b}
.cmp-pct{font-family:ui-monospace,monospace;font-size:13px;font-weight:800;color:#0f766e}
.cmp-val{font-size:22px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.cmp-bar{position:relative;height:12px;border-radius:999px;background:#f1f5f9;overflow:hidden;margin:11px 0 9px}
.cmp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#0d9488}
.cmp-fill.over{background:#047857}
.cmp-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#64748b}
.cmp-foot b{color:#0f172a;font-variant-numeric:tabular-nums}
.cmp-falta{font-weight:700;color:#b45309}
.cmp-supera{font-weight:700;color:#047857}
.cmp-nota{margin-top:8px;font-size:11px;color:#94a3b8}
.panel{border-radius:12px;background:#fff;overflow:hidden}
.panel.locked{display:flex;align-items:center;gap:12px;border:1px solid #e2e8f0;background:#f8fafc;padding:16px}
.panel.active{border:2px solid var(--brd)}
.panel.done{border:1px solid var(--brd)}
.pcircle{width:32px;height:32px;border-radius:999px;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pcircle .ic{width:16px;height:16px}
.pcircle-gray{width:32px;height:32px;border-radius:999px;background:#e2e8f0;color:#94a3b8;display:flex;align-items:center;justify-content:center;flex:none}
.pcircle-gray .ic{width:16px;height:16px}
.phead{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--brd);background:var(--soft)}
.phead-btn{display:flex;width:100%;align-items:center;gap:12px;padding:16px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit}
.pgrow{min-width:0;flex:1}
.p-title{font-size:14px;font-weight:600;color:#0f172a}
.p-title-muted{font-size:14px;font-weight:500;color:#64748b}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{padding:16px}
.pbody.bordered{border-top:1px solid #f1f5f9;padding-top:12px}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:96px;flex:none}
.thumb img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;display:block}
.thumb-x{position:absolute;top:4px;right:4px;background:#0f172a;color:#fff;border:none;border-radius:999px;padding:3px;cursor:pointer;display:flex}
.thumb-x .ic{width:12px;height:12px}
.thumb-dl{position:absolute;bottom:4px;right:4px;background:#0f172a;color:#fff;border:none;border-radius:999px;padding:3px;cursor:pointer;display:flex}
.thumb-dl .ic{width:12px;height:12px}
.thumb-dl:hover{background:#334155}
.photo-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:96px;height:96px;flex:none;border:2px dashed #cbd5e1;border-radius:8px;background:none;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;padding:4px}
.photo-add .ic{width:18px;height:18px}
.photo-add:hover{border-color:#94a3b8;color:#475569}
.pdf-list,.pdf-grid{display:flex;flex-direction:column;gap:8px}
.pdf-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;background:#fff}
.pdf-link{display:flex;align-items:center;gap:8px;color:#0f172a;font-size:13px;font-weight:600;text-decoration:none}
.pdf-link .ic{width:16px;height:16px}
.pdf-x{background:#0f172a;color:#fff;border:none;border-radius:999px;padding:4px;cursor:pointer;display:flex;flex:none}
.pdf-x .ic{width:12px;height:12px}
.pdf-add{display:flex;align-items:center;justify-content:center;gap:6px;border:2px dashed #cbd5e1;border-radius:8px;background:none;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:10px}
.pdf-add .ic{width:16px;height:16px}
.pdf-add:hover{border-color:#94a3b8;color:#475569}
.final{display:flex;align-items:center;gap:12px;border:1px solid #a7f3d0;background:#ecfdf5;border-radius:12px;padding:16px;margin-top:12px}
.final-circle{width:36px;height:36px;border-radius:999px;background:#059669;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.final-circle .ic{width:20px;height:20px}
.final-title{font-size:14px;font-weight:600;color:#065f46}
.final-sub{font-size:12px;color:#047857}
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.5)}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2)}

function compressImage(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onerror=reject;
    reader.onload=function(e){
      var img=new Image();
      img.onerror=reject;
      img.onload=function(){
        var w=img.width,h=img.height,max=900;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.72));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  var rows=orders.map(function(o){var d=o.data||{};return [o.code,o.cliente,STAGES[o.stageIndex].label,(d.solicitud||{}).fecha||'',(d.solicitud||{}).direccion||'',(d.programacion||{}).fecha_visita||'',(d.visita||{}).dias_fabricacion||'',(d.pago||{}).confirmacion||'',(d.pago||{}).importe||'',(d.pago||{}).fecha_programada||'',(d.finalizado||{}).fecha_entrega||''].map(csvCell).join(',');});
  var csv='\uFEFF'+[headers.join(',')].concat(rows).join('\n');
  try{ var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='pedidos.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }catch(e){}
}
function preview(key,o){
  var d=(o.data||{})[key];

  if(!d) return '';
  if(key==='programacion') return d.fecha_visita?'Visita '+fmtDate(d.fecha_visita):'';
  if(key==='visita'){ var nf=normPhotos(d.foto).length; return [d.fecha?fmtDate(d.fecha):'',d.tipo||'',d.dias_fabricacion?d.dias_fabricacion+' días fab.':'',nf?nf+' foto'+(nf>1?'s':''):''].filter(Boolean).join(' · '); }
  if(key==='pago') return [d.confirmacion,(moneyNum(d.importe)!==null?fmtMoney(d.importe):''),d.fecha_programada?fmtDate(d.fecha_programada):'',d.dias?d.dias+' días':''].filter(Boolean).join(' · ');
  if(key==='finalizado') return d.fecha_entrega?'Entrega '+fmtDate(d.fecha_entrega):'';

}

var pendingOps=[];
function syncFail(){ if(!storageError){ storageError=true; render(); } }
function syncOk(){ if(storageError){ storageError=false; render(); } }
function runOp(fn){ fn().then(function(){ syncOk(); flushOps(); }).catch(function(){ pendingOps.push(fn); syncFail(); }); }
function flushOps(){ if(!pendingOps.length) return Promise.resolve(true); var fn=pendingOps.shift(); return fn().then(function(){ syncOk(); return flushOps(); }).catch(function(){ pendingOps.unshift(fn); syncFail(); return false; }); }

    var raw=localStorage.getItem('seguimiento_pedidos_v1'); if(!raw) return Promise.resolve();
    var arr=JSON.parse(raw)||[]; var have={}; orders.forEach(function(o){have[o.id]=1;});
    var pend=arr.filter(function(o){return o&&o.id&&!have[o.id];});
    if(!pend.length){ localStorage.removeItem('seguimiento_pedidos_v1'); return Promise.resolve(); }
    return Promise.all(pend.map(function(o){ return remoteInsert(o).then(function(){return true;}).catch(function(){return false;}); }))
      .then(function(res){ var ok=res.every(function(x){return x;}); if(ok) localStorage.removeItem('seguimiento_pedidos_v1'); return fetchOrders(); })
      .then(function(list){ orders=list; lastFp=fingerprint(list); });
  }catch(e){ return Promise.resolve(); }

/* ==== Dashboard: importe facturado por semana ==== */
var MES_CORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function weekLbl(k){ var d=new Date(k+'T00:00:00'); if(isNaN(d.getTime())) return k; return d.getDate()+' '+MES_CORTO[d.getMonth()]; }
function weekRange(k){ return weekLbl(k)+' – '+weekLbl(addDays(k,6)); }
function fmtMoneyShort(n){ if(n===null||n===undefined) return '—'; var a=Math.abs(n); if(a>=1000000) return 'S/ '+(n/1000000).toFixed(1).replace(/\.0$/,'')+'M'; if(a>=1000) return 'S/ '+(n/1000).toFixed(1).replace(/\.0$/,'')+'k'; return 'S/ '+Math.round(n); }
function niceStep(v){ if(!(v>0)) return 25; var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var f=v/p; var m=(f<=1)?1:(f<=2)?2:(f<=2.5)?2.5:(f<=5)?5:10; return m*p; }
function escalaY(maxV){ if(!(maxV>0)) return {max:100,pasos:4}; var st=niceStep(maxV/4); var t=Math.ceil(maxV*1.06/st); if(t>6){ st=niceStep(maxV/6); t=Math.ceil(maxV*1.06/st); } if(t<2) t=2; return {max:st*t,pasos:t}; }
var DASH_ANIO_MIN=2026;
function mesLargoMin(ym){ var t=mesLargo(ym); return t.charAt(0).toLowerCase()+t.slice(1); }
function dashIncluye(c){ c=c||''; if(dashConf==='todos') return c!=='Venta caída'; if(dashConf==='conf') return c==='Confirmado'; return c==='Confirmado'||c==='Parcial'; }
function mesLbl(ym){ return MES_CORTO[parseInt(ym.slice(5,7),10)-1]+' '+ym.slice(0,4); }
function mesLargo(ym){ var N=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return N[parseInt(ym.slice(5,7),10)-1]+' '+ym.slice(0,4); }
function ultimoDiaMes(ym){ var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10); var d=new Date(y,m,0); return ym+'-'+String(d.getDate()).padStart(2,'0'); }
function mesSiguiente(ym){ var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)+1; if(m>12){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); }
function dashPagos(){
  var res=[];
  orders.forEach(function(o){
    if(isVentaCaida(o)) return;
    var pg=(o.data&&o.data.pago)||{}; var n=moneyNum(pg.importe);
    if(n===null||!pg.fecha_programada) return;
    if(!dashIncluye(pg.confirmacion)) return;
    res.push({f:pg.fecha_programada,v:n,c:o.cliente||''});
  });
  return res;
}
function dashPeriodoBase(){
  var hoy=todayStr(); var yy=parseInt(hoy.slice(0,4),10);
  var anio=(yy<DASH_ANIO_MIN)?DASH_ANIO_MIN:yy;
  var ini=anio+'-01-01', fin=hoy;
  dashPagos().forEach(function(p){ if(p.f>fin&&p.f>=ini) fin=p.f; });
  return {ini:ini,fin:fin,anio:anio};
}
function dashMeses(){
  var b=dashPeriodoBase(); var m=b.ini.slice(0,7), mf=b.fin.slice(0,7), out=[], g=0;
  while(m<=mf&&g<120){ out.push(m); m=mesSiguiente(m); g++; }
  return out;
}
function dashboardData(){
  var base=dashPeriodoBase();
  var ini=base.ini, fin=base.fin;
  if(dashMes){ ini=dashMes+'-01'; fin=ultimoDiaMes(dashMes); }
  var b={};
  dashPagos().forEach(function(p){
    if(p.f<ini||p.f>fin) return;
    var k=(dashGran==='mes')?p.f.slice(0,7):mondayOf(p.f);
    if(!k) return;
    if(!b[k]) b[k]={total:0,n:0};
    b[k].total+=p.v; b[k].n++;
  });
  var pts=[], g=0;
  if(dashGran==='mes'){
    var m=ini.slice(0,7), mf=fin.slice(0,7);
    while(m<=mf&&g<120){ pts.push({key:m,total:(b[m]?b[m].total:0),n:(b[m]?b[m].n:0),lbl:mesLbl(m),rango:mesLargo(m)}); m=mesSiguiente(m); g++; }
  } else {
    var w=mondayOf(ini), wf=mondayOf(fin);
    while(w&&w<=wf&&g<400){ pts.push({key:w,total:(b[w]?b[w].total:0),n:(b[w]?b[w].n:0),lbl:weekLbl(w),rango:weekRange(w)}); w=addDays(w,7); g++; }
  }
  while(pts.length&&pts[0].total<=0) pts.shift();
  if(dashMes){ while(pts.length&&pts[pts.length-1].total<=0) pts.pop(); }
  var hoy=todayStr();
  return {puntos:pts,anio:base.anio,ini:ini,fin:fin,actual:(dashGran==='mes')?hoy.slice(0,7):mondayOf(hoy)};
}
function dashChartHTML(W){
  var PW=720,PH=320,pl=62,pr=16,pt=20,pb=44;
  var iw=PW-pl-pr, ih=PH-pt-pb;
  var totals=W.map(function(w){return w.total;});
  var maxV=0; totals.forEach(function(v){ if(v>maxV) maxV=v; });
  var ESC=escalaY(maxV); var yMax=ESC.max, nTicks=ESC.pasos;
  var n=W.length;
  var xAt=function(i){ return (n<=1)?(pl+iw/2):(pl+iw*i/(n-1)); };
  var yAt=function(v){ return pt+ih-ih*(v/yMax); };
  var grid='',i;
  for(i=0;i<=nTicks;i++){
    var gv=yMax*i/nTicks, gy=yAt(gv);
    grid+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(pl+iw)+'" y2="'+gy.toFixed(1)+'" stroke="'+(i===0?'#cbd5e1':'#eef2f7')+'" stroke-width="1"/>';
    grid+='<text x="'+(pl-10)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#94a3b8" font-family="ui-monospace,monospace">'+esc(fmtMoneyShort(gv))+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/9)), xl='';
  for(i=0;i<n;i++){
    if(i%step!==0&&i!==n-1) continue;
    if(i!==n-1&&(n-1-i)<step*0.6) continue;
    var xa=(i===0&&n>1)?'start':((i===n-1&&n>1)?'end':'middle');
    xl+='<text x="'+xAt(i).toFixed(1)+'" y="'+(pt+ih+22)+'" text-anchor="'+xa+'" font-size="11" fill="#94a3b8" font-family="ui-monospace,monospace">'+esc(W[i].lbl)+'</text>';
  }
  var pts=[],dl=[],dots='';
  for(i=0;i<n;i++){ pts.push([xAt(i),yAt(W[i].total)]); }
  var line=pts.map(function(p,k){ return (k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area=(n>1)?(line+' L'+pts[n-1][0].toFixed(1)+' '+(pt+ih)+' L'+pts[0][0].toFixed(1)+' '+(pt+ih)+' Z'):'';
  var iMax=0; for(i=0;i<n;i++){ if(W[i].total>W[iMax].total) iMax=i; }
  for(i=0;i<n;i++){
    var esHito=(i===iMax&&W[i].total>0)||(i===n-1);
    dots+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="'+(esHito?4.5:3.2)+'" fill="'+(esHito?'#0d9488':'#fff')+'" stroke="#0d9488" stroke-width="2"/>';
  }
  var marcados={}; marcados[n-1]=1; if(W[iMax]&&W[iMax].total>0) marcados[iMax]=1;
  Object.keys(marcados).forEach(function(k){
    var j=parseInt(k,10); if(!W[j]||W[j].total<=0) return;
    var anchor=(n<=1)?'middle':((j===0)?'start':((j===n-1)?'end':'middle'));
    var vec=[]; if(j>0) vec.push(pts[j-1][1]); if(j<n-1) vec.push(pts[j+1][1]);
    var prom=vec.length?(vec.reduce(function(a,c){return a+c;},0)/vec.length):(pts[j][1]+50);
    var dy=(prom<pts[j][1]&&pts[j][1]<pt+ih-26)?19:-12;
    dl.push('<text x="'+pts[j][0].toFixed(1)+'" y="'+(pts[j][1]+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11.5" font-weight="700" fill="#0f172a" stroke="#fff" stroke-width="3.5" paint-order="stroke" font-family="ui-monospace,monospace">'+esc(fmtMoneyShort(W[j].total))+'</text>');
  });
  var meta=W.map(function(w,k){ return {x:+pts[k][0].toFixed(1),y:+pts[k][1].toFixed(1),lbl:w.rango,money:fmtMoney(w.total),n:w.n}; });
  return '<div class="dash-scroll"><svg class="dash-svg" id="dashsvg" viewBox="0 0 '+PW+' '+PH+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Importe facturado" data-pts="'+escA(JSON.stringify(meta))+'">'+
    '<defs><linearGradient id="dashg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/><stop offset="100%" stop-color="#0d9488" stop-opacity="0"/></linearGradient></defs>'+
    grid+xl+
    (area?'<path d="'+area+'" fill="url(#dashg)"/>':'')+
    (n>1?'<path d="'+line+'" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
    '<line id="dashcross" x1="0" y1="'+pt+'" x2="0" y2="'+(pt+ih)+'" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>'+
    dots+dl.join('')+
    '<circle id="dashhot" cx="0" cy="0" r="6" fill="#0d9488" stroke="#fff" stroke-width="2" opacity="0"/>'+
    '</svg></div>';
}
var VENTA_2025=209231.07;

  var t=0,n=0, a=String(anio);

  return {total:t,n:n};
}

/* ==== Ranking de clientes (MAESTRO e IBBIS se agrupan) ==== */
var CLIENTE_GRUPOS=['MAESTRO','IBBIS'];
function normCliente(s){
  s=String(s==null?'':s).toUpperCase();
  s=s.replace(/[\u00C1\u00C0\u00C4\u00C2]/g,'A').replace(/[\u00C9\u00C8\u00CB\u00CA]/g,'E').replace(/[\u00CD\u00CC\u00CF\u00CE]/g,'I').replace(/[\u00D3\u00D2\u00D6\u00D4]/g,'O').replace(/[\u00DA\u00D9\u00DC\u00DB]/g,'U').replace(/\u00D1/g,'N');
  return s.replace(/\s+/g,' ').trim();
}
function clienteGrupo(nombre){
  var n=normCliente(nombre);
  for(var i=0;i<CLIENTE_GRUPOS.length;i++){
    var g=CLIENTE_GRUPOS[i];
    if(n===g||(n.indexOf(g)===0&&!/[A-Z]/.test(n.charAt(g.length)))) return g;
  }
  return String(nombre==null?'':nombre).replace(/\s+/g,' ').trim()||'Sin cliente';
}
function esGrupo(nombre){ return CLIENTE_GRUPOS.indexOf(nombre)!==-1; }
function rankingClientes(ini,fin){
  var m={}, total=0;
  dashPagos().forEach(function(p){
    if(p.f<ini||p.f>fin) return;
    var g=clienteGrupo(p.c);
    if(!m[g]) m[g]={cliente:g,total:0,n:0,nombres:{}};
    m[g].total+=p.v; m[g].n++;
    var orig=String(p.c==null?'':p.c).replace(/\s+/g,' ').trim();
    if(orig) m[g].nombres[orig]=(m[g].nombres[orig]||0)+p.v;
    total+=p.v;
  });
  var list=Object.keys(m).map(function(k){
    var r=m[k]; r.locales=Object.keys(r.nombres).length; return r;
  }).sort(function(a,b){ return b.total-a.total; });
  return {list:list,total:total};
}
function rankingHTML(ini,fin,periodoTxt){
  var R=rankingClientes(ini,fin);
  if(!R.list.length){
    return '<div class="dash-sec"><div class="dash-sectitle">Ranking de clientes &middot; '+esc(periodoTxt)+'</div>'+
      '<div class="dash-card"><div class="dash-empty">Sin importes registrados en '+esc(periodoTxt)+'.</div></div></div>';
  }
  var max=R.list[0].total||0;
  var filas=R.list.map(function(r,i){
    var pct=R.total>0?(r.total/R.total*100):0;
    var w=max>0?(r.total/max*100):0;
    var col=(i===0)?'#0d9488':(i===1?'#14b8a6':(i===2?'#5eead4':'#cbd5e1'));
    var sub=(esGrupo(r.cliente)&&r.locales>1)?('<div class="kpi-sub" style="margin-top:3px">agrupa '+r.locales+' razones sociales o locales</div>'):'';
    return '<tr'+(i<3?' class="rk-top"':'')+'>'+
      '<td class="rk-pos">'+(i+1)+'</td>'+
      '<td><div class="rk-name">'+esc(r.cliente)+(esGrupo(r.cliente)?' <span class="rk-badge">grupo</span>':'')+'</div>'+sub+
        '<div class="per-bar"><div class="per-barfill" style="width:'+w.toFixed(1)+'%;background:'+col+'"></div></div></td>'+
      '<td class="num">'+r.n+'</td>'+
      '<td class="num">'+esc(fmtMoney(r.total))+'</td>'+
      '<td class="num">'+pct.toFixed(1).replace('.',',')+'%</td>'+
      '</tr>';
  }).join('');
  return '<div class="dash-sec"><div class="dash-sectitle">Ranking de clientes &middot; '+esc(periodoTxt)+'</div>'+
    '<div class="dash-card"><div class="dash-scroll"><table class="dash-tbl">'+
    '<thead><tr><th class="rk-pos">#</th><th>Cliente</th><th class="num">Pedidos</th><th class="num">Importe</th><th class="num">% del total</th></tr></thead>'+
    '<tbody>'+filas+'</tbody>'+
    '<tfoot><tr class="now"><td></td><td><b>Total</b></td><td class="num">'+R.list.reduce(function(a,r){return a+r.n;},0)+'</td>'+
    '<td class="num">'+esc(fmtMoney(R.total))+'</td><td class="num">100%</td></tr></tfoot>'+
    '</table></div></div></div>';
}

    '<div class="kpi"><div class="kpi-lbl">'+(esMes?'Mes':'Semana')+(dashMes?' más reciente':' actual')+'</div><div class="kpi-val">'+esc(act?fmtMoney(act.total):'—')+'</div><div class="kpi-sub">'+esc(act?act.rango:'—')+'</div></div>'+

  var periodoTxt=dashMes?mesLargo(dashMes)

  var cuerpo;

function bindDashboard(){
  var svg=document.getElementById('dashsvg'); if(!svg) return;
  var card=document.getElementById('dashcard'), tip=document.getElementById('dashtip');
  var cross=document.getElementById('dashcross'), hot=document.getElementById('dashhot');
  if(!card||!tip) return;
  var pts=[]; try{ pts=JSON.parse(svg.getAttribute('data-pts')||'[]'); }catch(e){ return; }
  if(!pts.length) return;
  function mostrar(ev){
    var t=(ev.touches&&ev.touches[0])?ev.touches[0]:ev;
    var r=svg.getBoundingClientRect(); if(!r.width) return;
    var cx=(t.clientX-r.left)/r.width*720;
    var b=0,bd=1e9;
    for(var i=0;i<pts.length;i++){ var d=Math.abs(pts[i].x-cx); if(d<bd){bd=d;b=i;} }
    var p=pts[b];
    cross.setAttribute('x1',p.x); cross.setAttribute('x2',p.x); cross.setAttribute('opacity','1');
    hot.setAttribute('cx',p.x); hot.setAttribute('cy',p.y); hot.setAttribute('opacity','1');
    var cr=card.getBoundingClientRect();
    var px=(r.left-cr.left)+p.x/720*r.width;
    var py=(r.top-cr.top)+p.y/320*r.height;
    px=Math.max(58,Math.min(cr.width-58,px));
    tip.innerHTML='<b>'+esc(p.lbl)+'</b><br>'+esc(p.money)+' · '+p.n+' pedido'+(p.n!==1?'s':'');
    tip.style.left=px+'px'; tip.style.top=py+'px'; tip.style.opacity='1';
  }
  function ocultar(){ tip.style.opacity='0'; cross.setAttribute('opacity','0'); hot.setAttribute('opacity','0'); }
  svg.addEventListener('mousemove',mostrar);
  svg.addEventListener('mouseleave',ocultar);
  svg.addEventListener('touchstart',mostrar,{passive:true});
  svg.addEventListener('touchmove',mostrar,{passive:true});
  svg.addEventListener('touchend',ocultar);
}

function fmtH(n){ var v=Math.round((n||0)*100)/100; return String(v).replace('.',',')+' h'; }
function capFirst(t){ t=String(t||''); return t.charAt(0).toUpperCase()+t.slice(1); }
function fechaLargaDia(f){ var d=new Date(f+'T00:00:00'); if(isNaN(d.getTime())) return f; return capFirst(d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})); }
function perColor(nm){ return PERSONAL_COLOR[nm]||'#64748b'; }
function perIni(){ if(perRango==='semana') return mondayOf(perFecha); if(perRango==='mes') return perFecha.slice(0,7)+'-01'; return perFecha; }
function perFin(){ if(perRango==='semana') return addDays(mondayOf(perFecha),6); if(perRango==='mes') return ultimoDiaMes(perFecha.slice(0,7)); return perFecha; }
function perRangoTxt(){ if(perRango==='semana') return 'Semana del '+fmtDate(perIni())+' al '+fmtDate(perFin()); if(perRango==='mes') return mesLargo(perFecha.slice(0,7)); return fechaLargaDia(perFecha); }
function perPedidos(){
  return orders.filter(function(o){ return !isVentaCaida(o); })
    .slice().sort(function(a,b){ return String(b.code||'').localeCompare(String(a.code||'')); });
}
function horasList(){
  var out=[];
  orders.forEach(function(o){
    var arr=(o.data&&o.data.horas)||[];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(h){
      if(!h||!h.fecha) return;
      out.push({oid:o.id,code:o.code||'',cliente:o.cliente||'',id:h.id||'',fecha:h.fecha,persona:h.persona||'',horas:(parseFloat(h.horas)||0),act:h.act||''});
    });
  });
  out.sort(function(a,b){ if(a.fecha!==b.fecha) return a.fecha<b.fecha?1:-1; return String(a.persona).localeCompare(String(b.persona)); });
  return out;
}
function horasEntre(ini,fin){ return horasList().filter(function(h){ return h.fecha>=ini&&h.fecha<=fin; }); }

function perSave(el){
  if(!canHoras()||!el) return;
  var c=el.closest('[data-form="peredit"]'); if(!c) return;
  var gv=function(n){ var x=c.querySelector('[name="'+n+'"]'); return x?x.value:''; };
  var oidOld=el.getAttribute('data-oid'), eid=el.getAttribute('data-eid');
  var per=gv('eppersona'), oidNew=gv('eppedido'), act=(gv('epact')||'').trim(), fec=gv('epfecha')||perFecha;
  var hs=parseFloat(gv('ephoras'));
  if(!per||!oidNew||!(hs>0)){ perMsg='Elige trabajador, pedido y una cantidad de horas mayor a 0.'; perMsgErr=true; render(); return; }
  if(hs>24) hs=24;
  var oOld=getOrder(oidOld);
  if(!oOld||!oOld.data||!Array.isArray(oOld.data.horas)){ perMsg='No se encontró el registro que quieres corregir.'; perMsgErr=true; render(); return; }
  var reg=null,i;
  for(i=0;i<oOld.data.horas.length;i++){ if(oOld.data.horas[i]&&oOld.data.horas[i].id===eid){ reg=oOld.data.horas[i]; break; } }
  if(!reg){ perMsg='No se encontró el registro que quieres corregir.'; perMsgErr=true; render(); return; }
  var nuevo={id:reg.id,fecha:fec,persona:per,horas:Math.round(hs*100)/100,act:act};
  var oDest=oOld;
  if(oidNew===oidOld){
    for(i=0;i<oOld.data.horas.length;i++){ if(oOld.data.horas[i]&&oOld.data.horas[i].id===eid){ oOld.data.horas[i]=nuevo; } }
    queueSaveOrder(oOld);
  } else {
    var oNew=getOrder(oidNew);
    if(!oNew){ perMsg='No se encontró el pedido al que quieres mover el registro.'; perMsgErr=true; render(); return; }
    oOld.data.horas=oOld.data.horas.filter(function(x){ return !x||x.id!==eid; });
    if(!oNew.data) oNew.data={};
    if(!Array.isArray(oNew.data.horas)) oNew.data.horas=[];
    oNew.data.horas.push(nuevo);
    queueSaveOrder(oOld); queueSaveOrder(oNew);
    oDest=oNew;
  }

  perMsgErr=false;
  render();

function perResumenPersona(rows){
  var m={};
  PERSONAL.forEach(function(n){ m[n]={persona:n,horas:0,dias:{},peds:{},n:0}; });
  rows.forEach(function(h){
    if(!m[h.persona]) m[h.persona]={persona:h.persona,horas:0,dias:{},peds:{},n:0};
    var r=m[h.persona]; r.horas+=h.horas; r.dias[h.fecha]=1; r.peds[h.oid]=1; r.n++;
  });
  return Object.keys(m).map(function(k){
    var r=m[k];
    return {persona:r.persona,horas:r.horas,dias:Object.keys(r.dias).length,peds:Object.keys(r.peds).length,n:r.n};
  }).sort(function(a,b){ return b.horas-a.horas; });
}
function perResumenPedido(rows){

function render(){
  var app=document.getElementById('app');
  if(!session){ app.innerHTML=viewLogin(); return; }
  if(currentRole()==='visita'&&view!=='list'&&view!=='calendar'){ view='list'; selectedId=null; }
  if(currentRole()==='supervisor'&&view!=='list'&&view!=='calendar'&&view!=='personal'&&view!=='detail'&&view!=='report'){ view='list'; }
  if(view==='dashboard'&&!canMod()){ view='list'; }
  if(view==='personal'&&!canHoras()){ view='list'; }
  var html=storageError?'<div class="banner">Sin conexión con la base de datos. Los últimos cambios se reintentarán automáticamente al recuperar internet.</div>':'';
  if(view==='detail'&&getOrder(selectedId)) html+=viewDetail(getOrder(selectedId));
  else if(view==='report'&&getOrder(selectedId)) html+=viewReport(getOrder(selectedId));
  else if(view==='calendar') html+=viewCalendar();
  else if(view==='dashboard') html+=viewDashboard();
  else if(view==='personal') html+=viewPersonal();
  else if(view==='new') html+=viewNew();
  else html+=viewList();
  app.innerHTML=html;
  if(view==='dashboard') bindDashboard();
}

  var o=getOrder(selectedId); if(!o) return;
  var idx=-1; for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===stageKey) idx=i; }
  if(idx<0 || idx!==o.stageIndex) return;
  if(o.stageIndex<=0) return;
  if(!window.confirm('¿Retroceder esta etapa y volver al estado anterior?')) return;
  o.stageIndex=o.stageIndex-1;
  queueSaveOrder(o);
  photoBuf={}; pdfBuf={}; expandedDone=null;
  render();
}
function doDelete(){
  if(!canDelete()) return;
  var delId=selectedId;
  orders=orders.filter(function(o){return o.id!==delId;});
  runOp(function(){ return remoteDelete(delId); });
  confirmingDelete=false; view='list'; selectedId=null; photoBuf={}; pdfBuf={}; render();
}

function onClick(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='login'){ doLogin(el.closest('[data-form="login"]')); }
  else if(act==='logout'){ logout(); }
  else if(act==='new'){ if(!canReg('solicitud')) return; photoBuf={}; pdfBuf={}; view='new'; render(); }
  else if(act==='back'){ photoBuf={}; pdfBuf={}; view='list'; render(); }
  else if(act==='open'){ if(currentRole()==='visita') return; photoBuf={}; pdfBuf={}; selectedId=el.getAttribute('data-id'); view='detail'; render(); }
  else if(act==='export'){ exportCSV(); }
  else if(act==='filter'){ var k=el.getAttribute('data-key'); filter=(k==='all')?null:k; updateFilterUI(); }
  else if(act==='photo-pick'){ var f=document.querySelector('.photo-file[data-cid="'+el.getAttribute('data-cid')+'"]'); if(f) f.click(); }
  else if(act==='pdf-pick'){ var f=document.querySelector('.pdf-file[data-cid="'+el.getAttribute('data-cid')+'"]'); if(f) f.click(); }
  else if(act==='photo-remove'){ var pc=el.getAttribute('data-cid'); var pi=parseInt(el.getAttribute('data-idx'),10); if(!Array.isArray(photoBuf[pc])) photoBuf[pc]=[]; photoBuf[pc].splice(pi,1); refreshPhoto(pc); }
  else if(act==='pdf-remove'){ var pc=el.getAttribute('data-cid'); var pi=parseInt(el.getAttribute('data-idx'),10); if(!Array.isArray(pdfBuf[pc])) pdfBuf[pc]=[]; pdfBuf[pc].splice(pi,1); refreshPdf(pc); }
  else if(act==='open-link'){ var _lf=el.closest('.field'); var _li=_lf?_lf.querySelector('input'):null; var _lu=_li?asURL(_li.value):null; if(_lu) window.open(_lu,'_blank','noopener'); }
  else if(act==='photo-dl'){ var _th=el.closest('.thumb'); var _im=_th?_th.querySelector('img'):null; if(_im&&_im.getAttribute('src')){ downloadDataURL(_im.getAttribute('src'), el.getAttribute('data-name')); } }
  else if(act==='toggle'){ var st=el.getAttribute('data-stage'); expandedDone=(expandedDone===st)?null:st; render(); }
  else if(act==='complete'){ completeStage(el.closest('[data-form]'),el.getAttribute('data-stage')); }
  else if(act==='save'){ saveStage(el.closest('[data-form]'),el.getAttribute('data-stage')); }
  else if(act==='revert'){ revertStage(el.getAttribute('data-stage')); }
  else if(act==='create'){ createOrder(el.closest('[data-form]')); }
  else if(act==='report'){ if(currentRole()==='visita') return; view='report'; render(); window.scrollTo(0,0); }
  else if(act==='calendar'){ view='calendar'; render(); window.scrollTo(0,0); }
  else if(act==='dashboard'){ if(!canMod()) return; view='dashboard'; render(); window.scrollTo(0,0); }
  else if(act==='personal'){ if(!canHoras()) return; perMsg=''; perMsgErr=false; perEdit=''; perEditOid=''; view='personal'; render(); window.scrollTo(0,0); }
  else if(act==='per-prev'){ perFecha=addDays(perFecha,-1)||perFecha; perMsg=''; perEdit=''; render(); }
  else if(act==='per-next'){ perFecha=addDays(perFecha,1)||perFecha; perMsg=''; perEdit=''; render(); }
  else if(act==='per-today'){ perFecha=todayStr(); perMsg=''; perEdit=''; render(); }
  else if(act==='per-rango'){ perRango=el.getAttribute('data-v')||'semana'; render(); }
  else if(act==='per-add'){ perAdd(el.closest('[data-form="perform"]')); }
  else if(act==='per-edit'){ perEditStart(el.getAttribute('data-oid'),el.getAttribute('data-eid')); }
  else if(act==='per-save'){ perSave(el); }
  else if(act==='per-cancel'){ perEditCancel(); }
  else if(act==='per-del'){ perDel(el.getAttribute('data-oid'),el.getAttribute('data-eid')); }
  else if(act==='dash-conf'){ dashConf=el.getAttribute('data-v')||'confpar'; render(); }
  else if(act==='dash-gran'){ dashGran=el.getAttribute('data-v')||'semana'; render(); }
  else if(act==='cal-prev'){ if(calMode==='week'){ calWeekStart=addDays(calWeekStart,-7); } else { calM--; if(calM<0){calM=11;calY--;} } render(); }
  else if(act==='cal-next'){ if(calMode==='week'){ calWeekStart=addDays(calWeekStart,7); } else { calM++; if(calM>11){calM=0;calY++;} } render(); }
  else if(act==='cal-today'){ if(calMode==='week'){ calWeekStart=mondayOf(todayStr()); } else { var _n=new Date(); calY=_n.getFullYear(); calM=_n.getMonth(); } render(); }
  else if(act==='cal-mode-month'){ calMode='month'; render(); }
  else if(act==='cal-mode-week'){ calMode='week'; calWeekStart=mondayOf(todayStr()); render(); }
  else if(act==='back-detail'){ view='detail'; render(); }
  else if(act==='print'){ window.print(); }
  else if(act==='del-open'){ if(!canDelete()) return; confirmingDelete=true; render(); }
  else if(act==='del-cancel'){ confirmingDelete=false; render(); }
  else if(act==='del-confirm'){ doDelete(); }
  else if(act==='feriados-open'){ feriadosOpen=true; render(); }
  else if(act==='feriados-close'){ feriadosOpen=false; render(); }
  else if(act==='feriados-add'){ var _fd=document.getElementById('feriado_date'), _fl=document.getElementById('feriado_label'); var _dv=_fd&&_fd.value; var _lv=(_fl&&_fl.value||'').trim(); if(_dv){ var _store=feriadosLoad(); _store.list=_store.list.filter(function(f){return f.date!==_dv;}); _store.list.push({date:_dv,label:_lv||'Feriado'}); feriadosSave(); } render(); }
  else if(act==='feriados-del'){ var _dd=el.getAttribute('data-date'); var _store2=feriadosLoad(); _store2.list=_store2.list.filter(function(f){return f.date!==_dd;}); feriadosSave(); render(); }
}
function onInput(e){ if(e.target.id==='search'){ search=e.target.value; rebuildList(); } }
function onKeydown(e){ if(e.key==='Enter'&&e.target&&e.target.getAttribute&&e.target.getAttribute('name')==='pass'){ e.preventDefault(); var c=e.target.closest('[data-form="login"]'); if(c) doLogin(c); } }
function onChange(e){
  var t=e.target;
  if(t&&t.name==='dashmes'){ dashMes=t.value||''; render(); return; }
  if(t&&t.name==='perfecha'){ if(t.value){ perFecha=t.value; perMsg=''; perEdit=''; render(); } return; }
  if(t.classList&&t.classList.contains('photo-file')){
    var files=t.files; if(!files||!files.length) return; var cid=t.getAttribute('data-cid');
    if(!Array.isArray(photoBuf[cid])) photoBuf[cid]=[];
    var list=Array.prototype.slice.call(files);
    Promise.all(list.map(function(f){return compressImage(f);})).then(function(b64s){ photoBuf[cid]=photoBuf[cid].concat(b64s); refreshPhoto(cid); }).catch(function(){});
    t.value='';
  }
  if(t.classList&&t.classList.contains('pdf-file')){
    var files=t.files; if(!files||!files.length) return; var cid=t.getAttribute('data-cid');
    if(!Array.isArray(pdfBuf[cid])) pdfBuf[cid]=[];
    var list=Array.prototype.slice.call(files);
    Promise.all(list.map(function(f){return readPdf(f);})).then(function(items){ pdfBuf[cid]=pdfBuf[cid].concat(items); refreshPdf(cid); }).catch(function(){});
    t.value='';
  }
}

(function init(){
  session=loadSession();
  var app=document.getElementById('app');
  app.addEventListener('click',onClick);
  app.addEventListener('input',onInput);
  app.addEventListener('change',onChange);
  app.addEventListener('keydown',onKeydown);
  render();
  fetchOrders().then(function(list){ orders=list; lastFp=fingerprint(list); loadingData=false; return migrateLocal(); })
    .then(function(){ render(); })
    .catch(function(){ loadingData=false; storageError=true; render(); });
  setInterval(function(){
    if(pendingOps.length){ flushOps(); return; }
    if(!session) return;
    if(view!=='list'&&view!=='calendar'&&view!=='dashboard'&&view!=='personal') return;
    if(confirmingDelete) return;
    if(perEdit) return;
    fetchOrders().then(function(list){ var fp=fingerprint(list); if(fp!==lastFp){ lastFp=fp; orders=list; render(); } }).catch(function(){});
  },20000);
})();
</script>
